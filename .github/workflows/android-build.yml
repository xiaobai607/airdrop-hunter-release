name: Android build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA from the active development branch
        required: true
        default: '19bed5d0bb2ffa752fffcf1df2677fd66f897f4a'
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-build
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'xiaobai607' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character commit SHA"
            exit 1
          fi

      - name: Checkout private core source
        uses: actions/checkout@v4
        with:
          repository: xiaobai607/airdrop-hunter
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.CORE_REPO_READ_TOKEN }}
          path: core
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests and assemble Debug APK
        working-directory: core/android
        shell: bash
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-hunter-debug-${{ inputs.source_sha }}
          path: core/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.actor == 'xiaobai607' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: airdrop-hunter-debug-${{ inputs.source_sha }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          short_sha="${SOURCE_SHA:0:12}"
          tag="debug-${short_sha}"
          gh release create "$tag" dist/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Airdrop Hunter Debug ${short_sha}" \
            --notes "Automated Debug APK built from private core commit ${SOURCE_SHA}. This is a test build, not a production-signed release."
